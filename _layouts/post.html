---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="label"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← Writing</a></p>
</article>

<style>
  .post-header { margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: var(--rule) solid var(--fg); }
  .post-header .label { display: block; margin: 0 0 0.75rem; }
  .post-title { font-size: clamp(1.8rem, 6vw, 2.5rem); }
  .post-content { line-height: 1.7; }
  .post-content p, .post-content ul, .post-content ol { margin: 1.1rem 0; }
  .post-content h2 { margin-top: 2.5rem; font-size: 1.3rem; }
  .post-content h3 { margin-top: 2rem; font-size: 1.1rem; }
  .post-back { margin-top: 3.5rem; font-size: 0.85rem; }
</style>
